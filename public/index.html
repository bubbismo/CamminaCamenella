<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>CamminaCamenella</title>
    <meta name="theme-color" content="#E5202A" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CamminaCamenella" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style id="expo-reset">
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
      html, body { height: 100%; background: #E5202A; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      #avvio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #E5202A; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #avvio img { width: 220px; height: 220px; }
      #avvio .nome { margin-top: 8px; font-size: 36px; font-weight: 900; color: #FFD23F; letter-spacing: -0.5px; }
      #avvio .slogan { margin-top: 6px; font-size: 18px; color: #fff; }
    </style>
  </head>
  <body>
    <noscript>Serve JavaScript per usare CamminaCamenella.</noscript>
    <div id="root">
      <!-- Schermata iniziale: si vede subito, mentre l'app si carica. Identica a quella animata dell'app. -->
      <div id="avvio"><img src="logo.png" alt="" width="220" height="220" /><div class="nome">CamminaCamenella</div><div class="slogan">Ogni passo conta!</div></div>
    </div>
    <script>
      // Il menu contestuale (pressione lunga) annullerebbe il tocco sui pulsanti: lo fermiamo prima che arrivi all'app.
      ['contextmenu', 'selectstart'].forEach(function (n) {
        window.addEventListener(n, function (e) { e.preventDefault(); e.stopImmediatePropagation(); }, true);
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
      }
    </script>
  </body>
</html>
